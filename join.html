<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <Meta name="viewport" content=" width=device-width,initial-scale=1.0">
            <title>K-POP Audition form </title>
            <link rel="stylesheet" href="style.css">
            <link rel="stylesheet" href="join.css">
     </head>
     <body>
        <div class = "form-container">
            <h1>K-pop Audition Form </h1>
            <p> please fill out the form completely . all information is required unless noted.</p>

            <form action="submit_audition.php" method ="post">
                <label>Full name</label>
                <input type="text"name="name" required>
                <label>Date of birth</label>
                <input type="date"name="dob"required>
                <label>Gender</label>
                <select name ="gender"required>
                    <option value="">select</option>
                    <option>Male</option>
                    <option>Female</option>
                    <option>Other</option>
                </select>

                <label for="nationality">Nationality</label>
                <select id="nationality" name="nationality" required>
    <option value="">Select your nationality</option>
    <option value="south_korean">South Korean</option>
    <option value="indian">Indian</option>
    <option value="japanese">Japanese</option>
    <option value="chinese">Chinese</option>
    <option value="thai">Thai</option>
    <option value="filipino">Filipino</option>
    <option value="american">American</option>
    <option value="british">British</option>
    <option value="australian">Australian</option>
    <option value="other">Other</option>
</select>

                
                <label>Email</label>
                <input type="email"name="email"required>

                <label>Phone number</label>
                <input type="tel"name="phone"required>

                <label>Audition categaory</label>
                <select name ="category"required >
                    <option value="">Select</option>
                    <option>Vocal</option>
                    <option>dance</option>
                    <option>Rap</option>
                    <option>Visual</option>
                </select>

                <label>Years of training </label>
                <input type="number" name="experience" min="o">
                <label>Upload Profile Photo</label>
                <input type="file"name="photo"accept="image/*" required>

                <label>Performance video link(Youtube/drive)</label>
                <input type="url" name="video" required>

                <label class ="checkbox">
                    <input type="checkbox"required>
                    I Confirm that all information is true.
                </label>

                <button type ="submit">submit Audition form</button>
            
            </form>
             <a href="home.html" class="back-btn">⬅ Back to Home</a>
        </div>
     </body>
       

</html>
